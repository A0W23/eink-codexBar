<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Codex Dashboard for ZECTRIX</title>
  <desc id="desc">A monochrome e-ink dashboard that keeps Codex quota and task activity visible on a ZECTRIX NOTE4.</desc>

  <rect width="1200" height="400" rx="24" fill="#f2f0e8"/>
  <path d="M0 320H1200" stroke="#c9c6bb"/>
  <path d="M744 0V400" stroke="#c9c6bb"/>

  <g transform="translate(56 48)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#64625c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">MACOS COMPANION · ZECTRIX NOTE4</text>
    <text x="0" y="82" fill="#11110f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">CODEX</text>
    <text x="0" y="148" fill="#11110f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">DASHBOARD</text>
    <text x="2" y="206" fill="#34332f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26">把额度与任务动态，留在桌面的电子纸上。</text>
  </g>

  <g transform="translate(56 346)" fill="#34332f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="0" y="0">400 × 300</text>
    <text x="140" y="0">LOCAL RENDER</text>
    <text x="330" y="0">PRIVACY MODE</text>
  </g>

  <g transform="translate(786 48)">
    <rect x="0" y="0" width="358" height="268" rx="18" fill="#11110f"/>
    <rect x="16" y="16" width="326" height="236" rx="5" fill="#fffef9"/>

    <g transform="translate(30 30)" fill="#11110f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      <text x="0" y="0" dominant-baseline="hanging" font-size="18">5 小时</text>
      <text x="0" y="54" font-size="42" font-weight="600">63</text>
      <text x="53" y="53" font-size="18">%</text>
      <text x="96" y="52" font-size="18">已用 37%</text>
      <rect x="0" y="66" width="296" height="12" fill="none" stroke="#11110f"/>
      <rect x="2" y="68" width="108" height="8" fill="#11110f"/>
      <text x="0" y="100" font-size="18">重置 2 小时</text>
      <path d="M0 116H296" stroke="#11110f" stroke-width="2"/>
      <text x="0" y="143" font-size="18">任务动态</text>
      <circle cx="6" cy="170" r="5" fill="#11110f"/>
      <text x="20" y="176" font-size="18">执行中</text>
      <path d="M0 191H296" stroke="#aaa89f"/>
      <circle cx="6" cy="215" r="5" fill="none" stroke="#11110f" stroke-width="2"/>
      <text x="20" y="221" font-size="18">本轮完成</text>
    </g>
  </g>

  <g transform="translate(786 346)" fill="#34332f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="0" y="0">QUOTA</text>
    <text x="100" y="0">TASK ACTIVITY</text>
    <text x="286" y="0">E-INK</text>
  </g>
</svg>
