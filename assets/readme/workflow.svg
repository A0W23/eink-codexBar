<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Codex 到 NOTE4 的数据路径</title>
  <desc id="desc">只读配额和任务事件在 Mac 本地归一化、渲染、去重，再经 ZECTRIX Cloud 推送到 NOTE4。</desc>
  <rect width="1200" height="520" rx="24" fill="#f2f0e8"/>
  <text x="56" y="54" fill="#64625c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">READ-ONLY DATA PATH</text>
  <text x="56" y="112" fill="#11110f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="42" font-weight="750">从 Codex 状态到 NOTE4 画面</text>
  <g transform="translate(56 172)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g><rect width="208" height="210" rx="12" fill="#fffef9" stroke="#11110f" stroke-width="2"/><text x="24" y="42" fill="#64625c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">01 / READ</text><text x="24" y="86" fill="#11110f" font-size="25" font-weight="700">Codex 状态</text><text x="24" y="124" fill="#34332f" font-size="20">配额窗口</text><text x="24" y="154" fill="#34332f" font-size="20">任务元数据</text><text x="24" y="184" fill="#34332f" font-size="20">Hooks 事件</text></g>
    <g transform="translate(292 0)"><rect width="208" height="210" rx="12" fill="#11110f"/><text x="24" y="42" fill="#9d9a90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">02 / LOCAL</text><text x="24" y="86" fill="#fffef9" font-size="25" font-weight="700">Companion</text><text x="24" y="124" fill="#c9c6bb" font-size="20">归一化状态</text><text x="24" y="154" fill="#c9c6bb" font-size="20">隐私模式</text><text x="24" y="184" fill="#c9c6bb" font-size="20">400×300 渲染</text></g>
    <g transform="translate(584 0)"><rect width="208" height="210" rx="12" fill="#fffef9" stroke="#11110f" stroke-width="2"/><text x="24" y="42" fill="#64625c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">03 / PUSH</text><text x="24" y="86" fill="#11110f" font-size="25" font-weight="700">变化检测</text><text x="24" y="124" fill="#34332f" font-size="20">画面哈希</text><text x="24" y="154" fill="#34332f" font-size="20">推送节流</text><text x="24" y="184" fill="#34332f" font-size="20">ZECTRIX Cloud</text></g>
    <g transform="translate(876 0)"><rect width="208" height="210" rx="12" fill="#11110f"/><text x="24" y="42" fill="#9d9a90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">04 / DISPLAY</text><text x="24" y="86" fill="#fffef9" font-size="25" font-weight="700">NOTE4</text><text x="24" y="124" fill="#c9c6bb" font-size="20">电子纸常显</text><text x="24" y="154" fill="#c9c6bb" font-size="20">设备定期刷新</text><text x="24" y="184" fill="#c9c6bb" font-size="20">无需持续发光</text></g>
    <g fill="none" stroke="#11110f" stroke-width="3"><path d="M218 105H282"/><path d="M272 95L282 105L272 115"/><path d="M510 105H574"/><path d="M564 95L574 105L564 115"/><path d="M802 105H866"/><path d="M856 95L866 105L856 115"/></g>
  </g>
  <path d="M56 430H1144" stroke="#c9c6bb"/>
  <g transform="translate(56 474)" fill="#34332f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18"><circle cx="7" cy="-6" r="6" fill="#11110f"/><text x="24" y="0">ONLY VISIBLE CHANGES ARE UPLOADED</text><text x="824" y="0">MAC → CLOUD → E-INK</text></g>
</svg>
